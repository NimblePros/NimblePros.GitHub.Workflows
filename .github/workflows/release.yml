name: Move Major Version Tag

# Runs in this repository only (it is not a reusable workflow). When a vMAJOR.MINOR.PATCH
# release is published, it points the moving major tag (for example v1) at the same commit,
# so callers that reference `@v1` pick up the release.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: move-major-tag
  cancel-in-progress: false

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    # Prereleases never move the major tag.
    if: ${{ !github.event.release.prerelease }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Move the major version tag
        env:
          # Passed through env, never interpolated into the script, so a crafted tag name
          # can't inject shell commands.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must look like vMAJOR.MINOR.PATCH (for example v1.2.0)."
            exit 1
          fi
          major_tag="v${BASH_REMATCH[1]}"

          # Resolve the release tag to its commit (works for lightweight and annotated tags).
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "$major_tag" "$commit" --message "Point $major_tag at $RELEASE_TAG"
          git push --force origin "refs/tags/${major_tag}"

          echo "Moved $major_tag to $RELEASE_TAG ($commit)." >> "$GITHUB_STEP_SUMMARY"
